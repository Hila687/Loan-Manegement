# Render.com blueprint (alternative to docker-compose on your own server).
# Render -> New -> Blueprint -> pick this repository.
# Note: the persistent disk for uploaded forms needs a paid web-service plan.
databases:
  - name: gemach-db
    databaseName: gemach
    user: gemach
    plan: basic-256mb

services:
  - type: web
    name: gemach
    runtime: docker
    plan: starter
    dockerCommand: docker-entrypoint.sh web
    healthCheckPath: /api/health/
    disk:
      name: gemach-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gemach-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SITE_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_SMS_FROM
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

  - type: cron
    name: gemach-reminders
    runtime: docker
    schedule: "0 6 * * *"   # 06:00 UTC = 09:00 Israel in summer, 08:00 in winter
    dockerCommand: docker-entrypoint.sh send_payment_reminders
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gemach-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_SMS_FROM
        sync: false
